<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>YT Stream Player — Opus Audio</title>
    <meta name="description" content="High quality YouTube audio streaming player using Opus codec (itag 251)">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="YT Stream">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Background Gradient Orbs -->
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>

        <!-- Header -->
        <header class="header" id="header">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="11" stroke="url(#logoGrad)" stroke-width="2"/>
                    <polygon points="10,8 16,12 10,16" fill="url(#logoGrad)"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="24" y2="24">
                            <stop offset="0%" stop-color="#a78bfa"/>
                            <stop offset="100%" stop-color="#f472b6"/>
                        </linearGradient>
                    </defs>
                </svg>
                <span>YT Stream</span>
            </div>
            <div class="search-container" id="searchContainer">
                <div class="search-box">
                    <button class="search-icon-btn" id="searchIconBtn" type="button" title="Tìm kiếm">
                        <svg class="icon-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                        </svg>
                        <svg class="icon-clear hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M18 6L6 18M6 6l12 12"/>
                        </svg>
                    </button>
                    <input type="text" id="searchInput" placeholder="Tìm kiếm bài hát hoặc dán YouTube URL..." autocomplete="off">
                    <button class="search-btn" id="searchBtn" title="Tìm kiếm">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="stream-mode-toggle" id="streamModeToggle" title="Chế độ stream">
                <button class="mode-btn active" data-mode="proxy" id="modeProxy">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    <span>Proxy</span>
                </button>
                <button class="mode-btn" data-mode="direct" id="modeDirect">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    <span>Direct</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main" id="mainContent">
            <!-- Welcome State (Trending) -->
            <section class="welcome" id="welcomeSection">
                <!-- Trending/Suggestions -->
                <div class="trending-section" id="trendingSection">
                    <h2 class="section-title trending-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="url(#trendGrad)">
                            <path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>
                            <defs>
                                <linearGradient id="trendGrad" x1="0" y1="0" x2="24" y2="24">
                                    <stop offset="0%" stop-color="#a78bfa"/>
                                    <stop offset="100%" stop-color="#f472b6"/>
                                </linearGradient>
                            </defs>
                        </svg>
                        Gợi ý cho bạn
                    </h2>
                    <div class="results-grid" id="trendingGrid"></div>
                    <div class="trending-loading" id="trendingLoading">
                        <div class="loader-ring small"></div>
                        <span>Đang tải gợi ý...</span>
                    </div>
                </div>
            </section>

            <!-- Search Results -->
            <section class="search-results hidden" id="searchResults">
                <h2 class="section-title" id="resultsTitle">Kết quả tìm kiếm</h2>
                <div class="results-grid" id="resultsGrid"></div>
            </section>

            <!-- Loading State -->
            <section class="loading-state hidden" id="loadingState">
                <div class="loader">
                    <div class="loader-ring"></div>
                    <div class="loader-ring"></div>
                    <div class="loader-ring"></div>
                </div>
                <p class="loading-text" id="loadingText">Đang tải...</p>
            </section>
        </main>

        <!-- Player Bar (Bottom) -->
        <div class="player-bar hidden" id="playerBar">
            <div class="player-progress-bar" id="playerProgressBar">
                <div class="player-progress-fill" id="playerProgressFill"></div>
                <input type="range" class="player-progress-input" id="playerProgressInput" min="0" max="100" value="0" step="0.1">
            </div>
            <div class="player-content">
                <div class="player-info">
                    <div class="player-thumb-wrapper">
                        <img class="player-thumb" id="playerThumb" src="" alt="">
                        <div class="player-thumb-pulse" id="playerThumbPulse"></div>
                    </div>
                    <div class="player-meta">
                        <div class="player-title" id="playerTitle">—</div>
                        <div class="player-artist" id="playerArtist">—</div>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="prevBtn" title="Bài trước">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn play-btn" id="playBtn" title="Phát / Tạm dừng">
                        <svg class="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="6,4 20,12 6,20"/>
                        </svg>
                        <svg class="icon-pause hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="nextBtn" title="Bài tiếp">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                </div>
                <div class="player-right">
                    <span class="player-time" id="playerTime">0:00 / 0:00</span>
                    <div class="volume-control">
                        <button class="ctrl-btn volume-btn" id="volumeBtn" title="Âm lượng">
                            <svg class="icon-vol" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg class="icon-mute hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                    </div>
                    <span class="player-badge" id="playerBadge">OPUS 251</span>
                </div>
            </div>
        </div>

        <!-- Audio Element -->
        <audio id="audioPlayer" preload="auto"></audio>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('[SW] Registered, scope:', reg.scope);
            }).catch(err => {
                console.log('[SW] Registration failed:', err);
            });
        }
    </script>
</body>
</html>
